# Deploys landing/ to Cloudflare Pages (project "trynod", https://trynod.pages.dev)
# whenever main changes it. Needs the CLOUDFLARE_API_TOKEN secret (Pages: Edit)
# and the CLOUDFLARE_ACCOUNT_ID variable in the repo settings.
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - landing/**
      - .github/workflows/deploy-landing.yml
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build and deploy
        run: npm run deploy -- --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
